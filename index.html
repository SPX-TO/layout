<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Layout Esteira</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <!-- TABS BOOTSTRAP -->
  <ul class="nav nav-tabs mb-2">
    <li class="nav-item">
      <button class="nav-link active"
              data-bs-toggle="tab"
              data-bs-target="#abaFanout">
        Fanouts
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link"
              data-bs-toggle="tab"
              data-bs-target="#abaOperadores">
        Operadores
      </button>
    </li>
  </ul>

  <!-- CONTEÚDO DAS ABAS -->
  <div class="tab-content">

    <!-- FANOUT -->
    <div id="abaFanout" class="tab-pane fade show active">
      <div class="bloco">
        <div class="fw-bold box-title">Fan-outs</div>

        <input id="fanoutInput" class="form-control mt-2 mb-2" placeholder="Buscar fan-out">

        <div id="listaFanoutsBusca"></div>

        <hr>

        <small class="text-muted">Selecionados</small>
        <div id="listaFanoutsSelecionados"></div>
      </div>
    </div>

    <!-- OPERADORES -->
    <div id="abaOperadores" class="tab-pane fade">
      <div class="bloco">

        <div class="fw-bold box-title">Operadores</div>

        <input id="buscaOperador" class="form-control mt-2 mb-2" placeholder="Buscar operador">

        <div id="listaOperadoresBusca"></div>

        <hr>

        

        <div class="grupo-funcao">
          <strong>Sem Função</strong>
          <div class="drop-funcao" data-funcao="sem_funcao"></div>
        </div>

        <div class="grupo-funcao">
          <strong>Indução</strong>
          <div class="drop-funcao" data-funcao="inducao"></div>
        </div>

        <div class="grupo-funcao">
          <strong>Lateral Esquerda</strong>
          <div class="drop-funcao" data-funcao="lateral_e"></div>
        </div>

        <div class="grupo-funcao">
          <strong>Lateral Direita</strong>
          <div class="drop-funcao" data-funcao="lateral_d"></div>
        </div>

        <div class="grupo-funcao">
          <strong>Pesca Esquerda</strong>
          <div class="drop-funcao" data-funcao="pesca_e"></div>
        </div>

        <div class="grupo-funcao">
          <strong>Pesca Direita</strong>
          <div class="drop-funcao" data-funcao="pesca_d"></div>
        </div>

        <div class="grupo-funcao">
          <strong>Bipe Esquerda</strong>
          <div class="drop-funcao" data-funcao="bipe_e"></div>
        </div>

        <div class="grupo-funcao">
          <strong>Bipe Direita</strong>
          <div class="drop-funcao" data-funcao="bipe_d"></div>
        </div>

        <div class="grupo-funcao">
          <strong>Gol</strong>
          <div class="drop-funcao" data-funcao="gol"></div>
        </div>

      </div>
    </div>

  </div>

</div>

<!-- CONTEÚDO -->
<div class="main-content">

  <div class="mb-2 d-flex gap-1">

  <button id="btnAddMesa" class="btn btn-primary btn-sm">
    + Mesa
  </button>
<button id="btnNovoLayout" class="btn btn-outline-danger btn-sm">
  Novo
</button>
  <button id="btnSalvarLayout" class="btn btn-success btn-sm">
    Salvar
  </button>

  <button id="btnCarregarLayout" class="btn btn-secondary btn-sm">
    Carregar
  </button>

  <button id="btnImprimir" class="btn btn-dark btn-sm">
    Imprimir
  </button>

</div>

  <div id="containerMesas"></div>

</div>

<!-- BOOTSTRAP JS (OBRIGATÓRIO PARA TABS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- SEU JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>

</body>
</html>
